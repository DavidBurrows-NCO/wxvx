baseline:
  compare: false # or false if you don't want to compare GFS-vs-GFS alongside Anemoi-vs-GFS
  name: PREPBUFR
  #url: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{yyyymmdd}/{hh}/atmos/gfs.t{hh}z.pgrb2.0p25.f{fh:03}
  url: https://noaa-reanalyses-pds.s3.amazonaws.com/index.html#observations/reanalysis/conv/prepbufr/2022/02/prepbufr/gdas.20220201.t12z.prepbufr.nr
cycles:
  - 2022-02-01T12:00:00
forecast:
  coords:
    latitude: latitude
    level: level
    longitude: longitude
    time:
      inittime: forecast_reference_time
      validtime: time
  name: Res
  path: /gpfs/f6/bil-fire8/scratch/David.Burrows/wxvx/aug5/output/met_output/point_stat/gfs.t12z.pgrb2.0p50.anl
  projection:
    proj: latlon
leadtimes: [0]
meta:
  grids: "{{ meta.workdir }}/grids"
  levels: &levels [500]
  workdir: /gpfs/f6/bil-fire8/scratch/David.Burrows/wxvx/aug5/output_obs
paths:
  grids:
    baseline: "{{ meta.grids }}/baseline"
    forecast: "{{ meta.grids }}/forecast"
  run: "{{ meta.workdir }}/run"
variables:
  temperature:
    level_type: isobaricInhPa
    levels: *levels
    name: t
